<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141B34" /><stop offset="1" stop-color="#3A4A7A" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0A0F22" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0A0F22" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="368" cy="128" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="434" cy="186" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="582" cy="121" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="33" cy="178" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="175" cy="166" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="606" cy="169" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="616" cy="157" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="446" cy="164" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="409" cy="197" r="3" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<g class="fl" filter="url(#sh)"><rect x="200" y="100" width="240" height="160" rx="28" fill="#fff" /><rect x="250" y="80" width="70" height="30" rx="10" fill="#fff" />
<circle cx="320" cy="180" r="58" fill="#202B46" /><circle cx="320" cy="180" r="40" fill="#3A4A7A" /><circle cx="320" cy="180" r="22" fill="#2BD2FF" /><circle cx="306" cy="166" r="8" fill="#fff" opacity=".8" />
<circle cx="410" cy="128" r="8" fill="#E0162B" class="tw" /></g>
<g fill="none" stroke="#2BD2FF" stroke-width="6" stroke-linecap="round" class="tw2"><path d="M150 140 a120 120 0 0 0 0 80" /><path d="M120 120 a160 160 0 0 0 0 120" /><path d="M490 140 a120 120 0 0 1 0 80" /><path d="M520 120 a160 160 0 0 1 0 120" /></g>
</svg>
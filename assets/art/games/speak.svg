<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E63E6D" /><stop offset="1" stop-color="#FF9A8B" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#8A1538" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8A1538" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="466" cy="45" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="551" cy="127" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="286" cy="127" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="71" cy="111" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="142" cy="113" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="119" cy="69" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="122" cy="98" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="260" cy="103" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="305" cy="171" r="2.2" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<g class="fl">
 <rect x="282" y="78" width="76" height="130" rx="38" fill="#fff" filter="url(#sh)" />
 <rect x="296" y="94" width="48" height="10" rx="5" fill="#E63E6D" opacity=".25" />
 <rect x="296" y="112" width="48" height="10" rx="5" fill="#E63E6D" opacity=".25" />
 <rect x="296" y="130" width="48" height="10" rx="5" fill="#E63E6D" opacity=".25" />
 <path d="M262 170 C262 222 378 222 378 170" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" />
 <rect x="314" y="214" width="12" height="38" fill="#fff" /><rect x="284" y="248" width="72" height="12" rx="6" fill="#fff" />
</g>

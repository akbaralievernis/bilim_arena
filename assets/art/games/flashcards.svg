 <circle cx="325" cy="150" r="44" fill="#E0162B" /><path d="M325 108 C325 96 334 88 344 86" stroke="#6B3A12" stroke-width="6" fill="none" stroke-linecap="round" />
 <path d="M330 100 C346 86 366 92 368 98 C352 108 340 106 330 100Z" fill="#21B8A6" /><ellipse cx="308" cy="136" rx="9" ry="14" fill="#fff" opacity=".45" />
 <text x="325" y="236" font-size="32" fill="#202B46" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">Алма</text><text x="325" y="270" font-size="20" fill="#E0162B" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">apple</text></g>
<circle class="tw" cx="470" cy="70" r="7" fill="#fff" /><circle class="tw2" cx="150" cy="80" r="5" fill="#fff" />


<g filter="url(#sh)"><rect x="200" y="150" width="240" height="170" rx="26" fill="#FFB547" /><rect x="200" y="150" width="240" height="30" rx="14" fill="#fff" opacity=".25" /></g>
<g class="" filter="url(#sh2)"><rect x="222" y="210" width="44" height="64" rx="10" fill="#202B46" /><text x="244.0" y="252.8" font-size="30" fill="#fff" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">7</text></g><g class="" filter="url(#sh2)"><rect x="274" y="210" width="44" height="64" rx="10" fill="#202B46" /><text x="296.0" y="252.8" font-size="30" fill="#fff" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">3</text></g><g class="pl" filter="url(#sh2)"><rect x="326" y="210" width="44" height="64" rx="10" fill="#fff" /><text x="348.0" y="252.8" font-size="30" fill="#202B46" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">?</text></g><g class="" filter="url(#sh2)"><rect x="378" y="210" width="44" height="64" rx="10" fill="#fff" /><text x="400.0" y="252.8" font-size="30" fill="#202B46" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">?</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F1C" /><stop offset="1" stop-color="#FFD166" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#9A5300" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#9A5300" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="203" cy="145" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="605" cy="173" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="82" cy="185" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="205" cy="90" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="148" cy="184" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="206" cy="124" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="128" cy="64" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="423" cy="182" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="336" cy="70" r="1.6" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<g class="pl" filter="url(#sh)"><circle cx="320" cy="200" r="100" fill="#fff" /><circle cx="320" cy="200" r="76" fill="#E0162B" /><circle cx="320" cy="200" r="52" fill="#fff" /><circle cx="320" cy="200" r="28" fill="#E0162B" /></g>
<g class="dr"><circle cx="160" cy="80" r="20" fill="#2F74E0" filter="url(#sh2)" /></g>
<g class="dr2"><path d="M480 60 l10 20 22 3 -16 15 4 22 -20 -11 -20 11 4 -22 -16 -15 22 -3z" fill="#FFF4C2" filter="url(#sh2)" /></g>
<g class="dr"><rect x="500" y="170" width="30" height="30" rx="6" fill="#0FA595" filter="url(#sh2)" /></g>
<g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"><path d="M140 240 h-40 M150 270 h-60 M140 300 h-40" /></g>

</svg>
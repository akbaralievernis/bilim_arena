 <ellipse cx="0" cy="18" rx="30" ry="22" fill="#8E5A2A" /><path d="M-14 36 l14 30 l14 -30z" fill="#6B3A12" />
 <circle cx="0" cy="-8" r="16" fill="#fff" /><path d="M8 -10 l16 6 l-14 6z" fill="#FFB547" /><circle cx="4" cy="-12" r="2.6" fill="#202B46" /></g>
</g><g class="fl2"><g transform="translate(470 240)"><path d="M0 0 q14 -24 28 0 q14 -24 28 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" /></g>


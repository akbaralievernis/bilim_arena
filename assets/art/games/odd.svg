<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F74E0" /><stop offset="1" stop-color="#6FD3FF" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#173E8A" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#173E8A" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="297" cy="94" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="492" cy="42" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="443" cy="69" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="261" cy="136" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="372" cy="60" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="366" cy="131" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="319" cy="130" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="571" cy="183" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="322" cy="118" r="3" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<g filter="url(#sh2)">
<circle cx="200" cy="120" r="44" fill="#fff" /><circle cx="320" cy="120" r="44" fill="#FFD166" /><circle cx="440" cy="120" r="44" fill="#fff" />
<circle cx="200" cy="240" r="44" fill="#FFD166" /><circle cx="440" cy="240" r="44" fill="#fff" /></g>
<g class="pl"><path d="M320 192 L366 280 H274Z" fill="#E0162B" filter="url(#sh)" /></g>
<circle cx="320" cy="248" r="72" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 10" class="sp" />
<text x="560" y="120" font-size="70" fill="#fff" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800" opacity=".75" class="fl">?</text>

</svg>
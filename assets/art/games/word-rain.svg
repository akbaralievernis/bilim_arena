<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F74E0" /><stop offset="1" stop-color="#6FD3FF" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#173E8A" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#173E8A" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="234" cy="196" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="44" cy="39" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="71" cy="116" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="372" cy="137" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="375" cy="139" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="317" cy="87" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="516" cy="87" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="424" cy="28" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="545" cy="145" r="3" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<g class="fl" fill="#fff" filter="url(#sh2)"><circle cx="190" cy="80" r="40" /><circle cx="240" cy="62" r="50" /><circle cx="295" cy="84" r="38" /><rect x="150" y="80" width="180" height="42" rx="21" /></g>
<g class="fl2" fill="#fff" opacity=".9" filter="url(#sh2)"><circle cx="420" cy="96" r="34" /><circle cx="462" cy="78" r="42" /><circle cx="505" cy="100" r="30" /><rect x="390" y="96" width="140" height="36" rx="18" /></g>
<g class="dr"><g class="" filter="url(#sh2)"><rect x="170" y="150" width="96" height="40" rx="20" fill="#173E8A" /><text x="218.0" y="176.48" font-size="18" fill="#fff" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">water</text></g></g>
<g class="dr2"><g class="" filter="url(#sh2)"><rect x="270" y="160" width="84" height="40" rx="20" fill="#FFD166" /><text x="312.0" y="186.48" font-size="18" fill="#173E8A" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">суу</text></g></g>
<g class="dr"><g class="" filter="url(#sh2)"><rect x="420" y="150" width="96" height="40" rx="20" fill="#fff" /><text x="468.0" y="176.48" font-size="18" fill="#2F74E0" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">вода</text></g></g>
<g fill="#fff" opacity=".85"><path class="dr2" d="M370 140 q-6 12 0 16 q6 -4 0 -16z" /><path class="dr" d="M230 200 q-6 12 0 16 q6 -4 0 -16z" /><path class="dr2" d="M500 200 q-6 12 0 16 q6 -4 0 -16z" /></g>


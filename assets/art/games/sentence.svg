<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0162B" /><stop offset="1" stop-color="#FF7A59" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#8E0B1A" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8E0B1A" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="94" cy="22" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="115" cy="49" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="44" cy="147" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="514" cy="83" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="404" cy="101" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="155" cy="49" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="602" cy="77" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="314" cy="46" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="245" cy="118" r="1.6" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<rect x="90" y="250" width="460" height="14" rx="7" fill="#fff" opacity=".55" />
<g class="" filter="url(#sh2)"><rect x="96" y="190" width="120" height="52" rx="14" fill="#fff" /><text x="156.0" y="224.64" font-size="24" fill="#E0162B" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">Мен</text></g>
<g class="" filter="url(#sh2)"><rect x="226" y="190" width="150" height="52" rx="14" fill="#FFD166" /><text x="301.0" y="223.92" font-size="22" fill="#8E0B1A" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">мектепке</text></g>
<g class="fl"><g class="" filter="url(#sh2)"><rect x="388" y="120" width="120" height="52" rx="14" fill="#5EE0C9" /><text x="448.0" y="153.92" font-size="22" fill="#07574F" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">барам</text></g></g>
<path d="M448 178 v14" stroke="#fff" stroke-width="4" stroke-dasharray="3 6" stroke-linecap="round" />
<g class="fl2" filter="url(#sh2)"><rect x="150" y="80" width="90" height="44" rx="14" fill="#fff" /><text x="195.0" y="112.8" font-size="30" fill="#E0162B" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800">.</text></g>
<g transform="translate(560 70)"><rect x="0" y="0" width="6" height="90" fill="#fff" /><path d="M6 4 h44 l-10 14 l10 14 h-44z" fill="#3B6CF6" /></g>
<g transform="translate(70 60)"><rect x="0" y="0" width="6" height="90" fill="#fff" /><path d="M6 4 h44 l-10 14 l10 14 h-44z" fill="#FFD166" /></g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026" /><stop offset="1" stop-color="#2B1650" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#05060F" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#05060F" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="552" cy="166" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="448" cy="39" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="616" cy="24" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="222" cy="132" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="435" cy="26" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="455" cy="116" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="154" cy="59" r="3" fill="#fff" opacity=".7" /><circle class="tw" cx="423" cy="30" r="1.6" fill="#fff" opacity=".7" /><circle class="tw2" cx="34" cy="85" r="2.2" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<defs><filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
 <path class="tw2" d="M70 250 C120 120 200 300 260 170 S 360 60 420 160" stroke="#FF3CAC" stroke-width="7" />
 <path class="tw" d="M200 300 C260 250 330 320 390 260 S 520 200 580 250" stroke="#2BD2FF" stroke-width="7" />
 <path d="M440 90 l20 40 44 6 -32 30 8 44 -40 -22 -40 22 8 -44 -32 -30 44 -6z" stroke="#FFE66D" stroke-width="6" />
</g>
<g class="fl"><g transform="translate(410 150)"><circle r="10" fill="#fff" filter="url(#neon)" /></g>

</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:fl 5s ease-in-out infinite}
.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 3.6s ease-in-out -1.3s infinite}
.sp,.pl{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.pl{animation:pl 2.4s ease-in-out infinite}
.dr{animation:dr 3.2s linear infinite}
.dr2{animation:dr 3.2s linear -1.6s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes dr{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0FA595" /><stop offset="1" stop-color="#5EE0C9" /></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
<linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset="1" stop-color="#fff" stop-opacity=".04" /></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07574F" flood-opacity=".35" /></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#07574F" flood-opacity=".3" /></filter>

</defs>
<rect width="640" height="360" fill="url(#bg)" />
<circle cx="560" cy="40" r="150" fill="#fff" opacity=".08" />
<circle cx="60" cy="330" r="120" fill="#fff" opacity=".07" />
<ellipse cx="320" cy="170" rx="300" ry="170" fill="url(#glow)" />
<circle class="tw2" cx="290" cy="191" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="494" cy="161" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="595" cy="200" r="2.2" fill="#fff" opacity=".7" /><circle class="tw" cx="398" cy="117" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="247" cy="118" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="572" cy="90" r="2.2" fill="#fff" opacity=".7" /><circle class="tw2" cx="603" cy="143" r="1.6" fill="#fff" opacity=".7" /><circle class="tw" cx="440" cy="93" r="3" fill="#fff" opacity=".7" /><circle class="tw2" cx="479" cy="141" r="3" fill="#fff" opacity=".7" />
<path d="M0 300 C 110 270 200 330 320 305 S 540 270 640 300 V360 H0Z" fill="url(#wv)" />
<path d="M0 325 C 140 300 230 350 360 330 S 560 305 640 328 V360 H0Z" fill="#fff" opacity=".12" />

<rect x="80" y="276" width="480" height="16" rx="8" fill="#fff" opacity=".6" />
<g filter="url(#sh)"><path d="M240 80 h40 v70 l52 110 a14 14 0 0 1 -12 20 h-120 a14 14 0 0 1 -12 -20 l52 -110z" fill="#fff" opacity=".95" />
 <path d="M212 220 h96 l20 42 a12 12 0 0 1 -10 18 h-116 a12 12 0 0 1 -10 -18z" fill="#E0162B" /></g>
<rect x="232" y="72" width="56" height="14" rx="7" fill="#fff" />
<g fill="#fff"><circle class="dr2" cx="250" cy="200" r="7" opacity=".8" /><circle class="dr" cx="272" cy="190" r="5" opacity=".8" /></g>
<g filter="url(#sh)"><rect x="380" y="120" width="60" height="156" rx="12" fill="#fff" opacity=".95" /><rect x="380" y="190" width="60" height="86" rx="12" fill="#2F74E0" /><rect x="372" y="112" width="76" height="14" rx="7" fill="#fff" /></g>
<g class="fl"><rect x="470" y="200" width="60" height="60" rx="10" fill="#C8F1FF" stroke="#fff" stroke-width="4" transform="rotate(12 500 230)" /><path d="M482 214 l16 0" stroke="#fff" stroke-width="5" stroke-linecap="round" /></g>
<g class="sp"><g transform="translate(120 130)"><circle r="10" fill="#FFD166" /><g fill="none" stroke="#fff" stroke-width="3"><ellipse rx="44" ry="16" /><ellipse rx="44" ry="16" transform="rotate(60)" /><ellipse rx="44" ry="16" transform="rotate(-60)" /></g></g>

</g></svg>
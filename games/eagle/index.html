    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" integrity="sha384-q1KhAZhJcJXr3zfC3Tz07pBqQSabwFIZhXlmlUAB8s0zk4ETWERkIKGBCFQ5Jc3e" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary: #c0392b;
            --secondary: #2980b9;
            --gold: #f1c40f;
            --dark: #1a1a2e;
            --glass-bg: rgba(20, 30, 48, 0.85);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Montserrat', sans-serif;
            overflow: hidden; color: white;
        }

        #webcam { display: none; }

        /* Игровой контейнер (Адаптивный) */
        #game-container {
            position: relative;
            width: 100%; max-width: 800px;
            aspect-ratio: 4 / 3;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(241, 196, 15, 0.2);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid var(--gold);
        }

        #gameCanvas {
            display: block; width: 100%; height: 100%;
            background-color: #0b0c10;
        }

        /* --- UI СЛОЙ (Glassmorphism) --- */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            opacity: 1; transition: opacity 0.3s; z-index: 10;
        }
        .hidden { opacity: 0; pointer-events: none; z-index: -1; }

        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 40px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            min-width: 350px;
        }

        h1 { margin: 0 0 10px 0; font-size: 3rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .text-gold { color: var(--gold); text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .text-red { color: #e74c3c; }
        .text-blue { color: #3498db; }
        
        p.subtitle { margin-top: 0; margin-bottom: 30px; color: #bdc3c7; font-size: 1.1rem; }

        /* Кнопки */
        .btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 15px;
            font-size: 1.2rem; font-weight: 800; font-family: inherit;
            color: white; background: rgba(255,255,255,0.1);
            border: 2px solid transparent; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: #e74c3c; border-color: white; box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }
        .btn-secondary { background: var(--secondary); }
        .btn-secondary:hover { background: #3498db; border-color: white; box-shadow: 0 0 20px rgba(52, 152, 219, 0.4); }
        .btn-gold { background: #d4ac0d; color: #111; }
        .btn-gold:hover { background: var(--gold); border-color: white; box-shadow: 0 0 20px rgba(241, 196, 15, 0.4); }

        /* HUD (Интерфейс во время игры) */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px;
            box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 5;
        }
        .hud-score { font-size: 3rem; font-weight: 900; text-shadow: 2px 4px 10px rgba(0,0,0,0.8); margin: 0; }
        .team-red-score { color: #e74c3c; }
        .team-blue-score { color: #3498db; }
        
        #btn-pause {
            pointer-events: auto; background: rgba(0,0,0,0.5); border: 2px solid white;
            color: white; width: 50px; height: 50px; border-radius: 12px;
            font-size: 1.5rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        #btn-pause:hover { background: white; color: black; }

        /* Таблица рекордов */
        .records-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        .records-table th, .records-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .records-table th { color: var(--gold); }

        /* Статус камеры */
        #cam-status {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px;
            font-size: 0.9rem; z-index: 20; border: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 10px; pointer-events: none;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #f1c40f; box-shadow: 0 0 8px #f1c40f; }
        .cam-ok .dot { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .cam-err .dot { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

        /* ═══ Bilim Arena 2.0: цвета сайта, вопросы в полёте, жизни ═══ */
        :root { --primary: #E0162B; --secondary: #0FA595; --gold: #FFB547; --glass-bg: rgba(16, 18, 46, 0.88); }
        body { background: linear-gradient(135deg, #0B1026 0%, #1B1446 55%, #3A0D2E 100%); }
        #game-container { border: 0; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08); border-radius: 26px; }
        .panel { border-radius: 26px; background: linear-gradient(160deg, rgba(27,20,70,.94), rgba(58,13,46,.94)); }
        .btn { border-radius: 14px; text-transform: none; letter-spacing: 0; }
        .btn-primary { background: linear-gradient(120deg, #E0162B, #FF3D57 45%, #FF7A59); box-shadow: 0 12px 28px -10px rgba(224,22,43,.7); }
        .btn-secondary { background: linear-gradient(120deg, #0FA595, #2F74E0); }
        .btn-gold { background: #FFB547; color: #2a1600; }
        .text-gold { color: #FFB547; text-shadow: 0 0 18px rgba(255,181,71,.45); }
        .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 14px; }
        .mode-btn { padding: 10px 8px; border-radius: 12px; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; font: 700 .95rem/1.2 'Inter', system-ui, sans-serif; cursor: pointer; }
        .mode-btn[aria-pressed="true"] { border-color: #FFB547; background: rgba(255,181,71,.16); }
        .mode-btn small { display: block; font-weight: 500; opacity: .75; margin-top: 2px; font-size: .78rem; }
        #hud .hud-side { display: flex; flex-direction: column; gap: 4px; }
        .hearts { font-size: 1.25rem; letter-spacing: 2px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
        .hud-level { font: 800 .8rem/1 'Inter', system-ui, sans-serif; color: #FFB547; text-transform: uppercase; letter-spacing: .06em; }
        #qbanner {
            position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 6; pointer-events: none;
            padding: 10px 18px; border-radius: 16px; max-width: 70%;
            background: rgba(11,16,38,.82); border: 2px solid #FFB547; box-shadow: 0 10px 30px rgba(0,0,0,.45);
            font: 800 1.35rem/1.2 'Montserrat', 'Inter', sans-serif; color: #fff; text-align: center;
            transition: opacity .2s, transform .2s;
        }
        #qbanner.hidden { opacity: 0; transform: translateX(-50%) translateY(-8px); }
        #qbanner small { display: block; font: 600 .8rem/1.3 'Inter', sans-serif; color: rgba(255,255,255,.7); margin-top: 2px; }
        #flashmsg { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 7; pointer-events: none;
            font: 900 2.4rem/1 'Montserrat', sans-serif; text-shadow: 0 4px 18px rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; }
        #flashmsg.show { opacity: 1; }

    </style>

<body>
  <a class="ba-back" href="../../games.html" style="position:fixed;top:12px;left:12px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;min-height:44px;border-radius:14px;background:rgba(255,255,255,.94);color:#202B46;font:700 15px/1 'Inter',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 16px rgba(32,43,70,.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Оюндар</span></a>

    <video id="webcam" autoplay playsinline></video>

    <div id="game-container">
        <!-- Холст игры -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- HUD (Счет и Пауза) -->
        <div id="hud" class="hidden">
            <div style="display: flex; gap: 30px;">
                <div class="hud-side">
                    <div style="font-size: 0.8rem; color: #bdc3c7; text-transform: uppercase; margin-bottom: -5px;">Команда Күн</div>
                    <div id="score-1p" class="hud-score team-red-score">0</div>
                    <div class="hearts" id="hearts-1p" role="img" aria-label="Жашоо"></div>
                    <div class="hud-level" id="hud-level"></div>
                </div>
                <div id="score-2p-container" class="hidden hud-side">
                    <div style="font-size: 0.8rem; color: #bdc3c7; text-transform: uppercase; margin-bottom: -5px;">Команда Асман</div>
                    <div id="score-2p" class="hud-score team-blue-score">0</div>
                    <div class="hearts" id="hearts-2p" role="img" aria-label="Жашоо"></div>
                </div>
            </div>
            <button id="btn-pause">II</button>
        </div>

        <!-- Вопрос перед воротами и короткое сообщение «Туура!» -->
        <div id="qbanner" class="hidden" aria-live="polite"></div>
        <div id="flashmsg" aria-hidden="true"></div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menu-main" class="ui-layer">
            <div class="panel">
                <h1 class="text-gold">КЫРГЫЗ<br><span style="color:white">БҮРКҮТҮ</span></h1>
                <p class="subtitle">Кушту колдун кыймылдары менен башкарыңыз!</p>
                <div class="mode-row" role="group" aria-label="Оюн режими">
                    <button class="mode-btn" type="button" id="mode-learn" aria-pressed="true">Билим учуусу<small>Суроо дарбазалары</small></button>
                    <button class="mode-btn" type="button" id="mode-classic" aria-pressed="false">Классикалык<small>Тоскоолдуктар гана</small></button>
                </div>
                <div class="mode-row" role="group" aria-label="Суроолор" id="content-row">
                    <button class="mode-btn" type="button" id="content-words" aria-pressed="true">Сөздөр<small id="content-words-sub">Котормо</small></button>
                    <button class="mode-btn" type="button" id="content-mult" aria-pressed="false">Көбөйтүү<small>2–9 таблица</small></button>
                </div>
                <button class="btn btn-primary" data-on="startGame(1)">1 Оюнчу (Жалгыз)</button>
                <button class="btn btn-secondary" data-on="startGame(2)">2 Оюнчу (Команда)</button>
                <button class="btn btn-gold" data-on="showScreen('menu-records')">Рекорддор тизмеси</button>
                <div style="margin-top: 15px; font-size: 0.8rem; color: #95a5a6;">
                    <div>Эки оюнчу: сол кол — кызыл куш, оң кол — көк куш</div><div>Учуу үчүн баш бармак менен сөөмөйдү чымчыңыз</div>
                </div>
            </div>
        </div>

        <!-- МЕНЮ ПАУЗЫ -->
        <div id="menu-pause" class="ui-layer hidden">
            <div class="panel">
                <h1>ТЫНЫМ</h1>
                <button class="btn btn-primary" data-on="resumeGame()">Улантуу</button>
                <button class="btn btn-gold" data-on="quitToMenu()">Башкы меню</button>
            </div>
        </div>

        <!-- МЕНЮ ИГРА ОКОНЧЕНА -->
        <div id="menu-gameover" class="ui-layer hidden">
            <div class="panel">
                <h1 class="text-red">ОЙ-БОЙ!</h1>
                <h2 id="go-winner" style="margin-top: -10px; margin-bottom: 20px;"></h2>
                <div style="font-size: 1.5rem; margin-bottom: 30px;">
                    Упай: <span id="go-score" class="text-gold">0</span>
                </div>
                <button class="btn btn-primary" data-on="restartGame()">Кайра ойноо</button>
                <button class="btn btn-gold" data-on="quitToMenu()">Башкы меню</button>
            </div>
        </div>

        <!-- МЕНЮ РЕКОРДОВ -->
        <div id="menu-records" class="ui-layer hidden">
            <div class="panel">
                <h1 class="text-gold">РЕКОРДДОР</h1>
                <table class="records-table">
                    <thead><tr><th>Орун</th><th>Упай</th><th>Дата</th></tr></thead>
                    <tbody id="records-body"></tbody>
                </table>
                <button class="btn btn-primary" data-on="showScreen('menu-main')">Артка</button>
            </div>
        </div>

        <!-- Индикатор Камеры -->
        <div id="cam-status">
            <div class="dot"></div>
            <span id="cam-text">ЖИ демилгелөө (MediaPipe)...</span>
        </div>
    </div>

    <script src="./game.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; connect-src 'self' https://udkxmgflbxetfzziftla.supabase.co wss://udkxmgflbxetfzziftla.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Шарлар — Билим Арена</title>
  <link rel="icon" href="../../assets/brand/favicon-64.png" type="image/png" />
  <link rel="stylesheet" href="../../shared/game.css?v=17" />
  <style>
    .gWrap { max-width: 640px; }
    .balloons { display: flex; justify-content: center; gap: 6px; height: 110px; align-items: flex-end; margin-bottom: 6px; }
    .bl { position: relative; width: 44px; height: 100px; animation: float 3s ease-in-out infinite; }
    .bl:nth-child(2n) { animation-delay: -1.5s; }
    .bl::before { content: ''; position: absolute; top: 0; left: 0; width: 44px; height: 54px; border-radius: 50% 50% 48% 48%; background: var(--c); box-shadow: inset -6px -8px 0 rgba(0,0,0,.15), inset 6px 6px 0 rgba(255,255,255,.3); }
    .bl::after { content: ''; position: absolute; top: 54px; left: 21px; width: 2px; height: 46px; background: var(--soft); opacity: .6; }
    .bl.pop { animation: pop2 .35s forwards; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes pop2 { 0% { transform: scale(1); } 40% { transform: scale(1.3); opacity: .8; } 100% { transform: scale(0); opacity: 0; } }
    .clue { text-align: center; margin: 6px 0 16px; }
    .clue .em { font-size: 3.5rem; line-height: 1.1; }
    .clue .tr { font-weight: 700; color: var(--soft); }
    .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .slot {
      width: clamp(34px, 9vw, 46px); height: clamp(44px, 11vw, 56px); display: grid; place-items: center;
      border-bottom: 4px solid var(--primary); font-family: var(--font-title); font-weight: 900; font-size: clamp(1.4rem, 6vw, 2rem); text-transform: uppercase;
    }
    .slot.space { border: 0; width: 16px; }
    .slot.show { animation: pop .3s; }
    .slot.missed { color: var(--bad); }
    .kb { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
    .key { width: clamp(32px, 8.5vw, 44px); height: 46px; border-radius: 10px; border: 0; background: var(--card-strong); font-weight: 800; font-size: 1.05rem; text-transform: uppercase; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .key.kg { outline: 2px solid var(--primary); outline-offset: -2px; }
    .key.ok { background: var(--ok); color: #fff; }
    .key.no { background: #475569; color: #94a3b8; }
  </style>
  <script src="../../shared/lang.js?v=16"></script>
  <script src="./i18n.js?v=15"></script>
  <script src="../../shared/sw-register.js?v=15"></script>
</head>
<body>
  <header class="gTop">
    <a class="iconBtn" href="../../games.html" aria-label="Оюндар"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="title">Шарлар <small>Сөздү тамга-тамга тап — шарларды сакта!</small></div>
    <button class="iconBtn" id="soundBtn" type="button" aria-label="Үн"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="iconBtn" id="themeBtn" type="button" aria-label="Тема" hidden></button>
  </header>

  <main class="gWrap">
    <div class="hud">
      <div class="stat"><b id="round">1</b><span>Раунд</span></div>
      <div class="stat"><b id="score">0</b><span>Упай</span></div>
      <div class="stat"><b id="streak">0</b><span>Катары менен</span></div>
    </div>
    <div class="panel">
      <div class="balloons" id="balloons" role="group" aria-label="Калган шарлар"></div>
      <div class="clue">
        <div class="em" id="clueEmoji"></div>
        <div class="tr" id="clueTr" translate="no"></div>
      </div>
      <div class="slots" id="slots" translate="no" aria-live="polite"></div>
      <div class="kb" id="kb" translate="no"></div>
    </div>
    <div class="center" style="margin-top:14px">
      <div class="chips" id="catChips" style="justify-content:center"></div>
    </div>
  </main>

  <div class="modal hidden" id="endModal">
    <div class="panel">
      <div class="bigEmoji" id="endEmoji"></div>
      <h2 class="gH" id="endTitle"></h2>
      <p style="font-size:1.8rem;font-weight:900;letter-spacing:.1em;margin:4px 0" id="endWord" translate="no"></p>
      <p class="muted" id="endTr" translate="no"></p>
      <button class="btn primary" id="nextBtn" type="button">Кийинки сөз</button>
    </div>
  </div>

  <script src="../../shared/fresh.js?v=1"></script>
  <script src="../../shared/vocab.js?v=18"></script>
  <script src="../../shared/progress.js?v=15"></script>
  <script src="../../shared/game-shell.js?v=15"></script>
  <script src="./game.js?v=1"></script>
</body>
</html>

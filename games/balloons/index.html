<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Шарлар — Билим Арена</title>
  <link rel="stylesheet" href="../../shared/game.css" />
  <style>
    .gWrap { max-width: 640px; }
    .balloons { display: flex; justify-content: center; gap: 6px; height: 110px; align-items: flex-end; margin-bottom: 6px; }
    .bl { position: relative; width: 44px; height: 100px; animation: float 3s ease-in-out infinite; }
    .bl:nth-child(2n) { animation-delay: -1.5s; }
    .bl::before { content: ''; position: absolute; top: 0; left: 0; width: 44px; height: 54px; border-radius: 50% 50% 48% 48%; background: var(--c); box-shadow: inset -6px -8px 0 rgba(0,0,0,.15), inset 6px 6px 0 rgba(255,255,255,.3); }
    .bl::after { content: ''; position: absolute; top: 54px; left: 21px; width: 2px; height: 46px; background: var(--soft); opacity: .6; }
    .bl.pop { animation: pop2 .35s forwards; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes pop2 { 0% { transform: scale(1); } 40% { transform: scale(1.3); opacity: .8; } 100% { transform: scale(0); opacity: 0; } }
    .clue { text-align: center; margin: 6px 0 16px; }
    .clue .em { font-size: 3.5rem; line-height: 1.1; }
    .clue .tr { font-weight: 700; color: var(--soft); }
    .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .slot {
      width: clamp(34px, 9vw, 46px); height: clamp(44px, 11vw, 56px); display: grid; place-items: center;
      border-bottom: 4px solid var(--primary); font-family: var(--font-title); font-weight: 900; font-size: clamp(1.4rem, 6vw, 2rem); text-transform: uppercase;
    }
    .slot.space { border: 0; width: 16px; }
    .slot.show { animation: pop .3s; }
    .slot.missed { color: var(--bad); }
    .kb { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
    .key { width: clamp(32px, 8.5vw, 44px); height: 46px; border-radius: 10px; border: 0; background: var(--card-strong); font-weight: 800; font-size: 1.05rem; text-transform: uppercase; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .key.kg { outline: 2px solid var(--primary); outline-offset: -2px; }
    .key.ok { background: var(--ok); color: #fff; }
    .key.no { background: #475569; color: #94a3b8; }
  </style>
</head>
<body>
  <header class="gTop">
    <a class="iconBtn" href="../../games.html" aria-label="Башкы бетке">←</a>
    <div class="title">🎈 Шарлар <small>Сөздү тамга-тамга тап — шарларды сакта!</small></div>
    <button class="iconBtn" id="soundBtn" type="button" aria-label="Үн">🔊</button>
    <button class="iconBtn" id="themeBtn" type="button" aria-label="Тема">🌙</button>
  </header>

  <main class="gWrap">
    <div class="hud">
      <div class="stat"><b id="round">1</b><span>Раунд</span></div>
      <div class="stat"><b id="score">0</b><span>Упай</span></div>
      <div class="stat"><b id="streak">0</b><span>Катары менен</span></div>
    </div>
    <div class="panel">
      <div class="balloons" id="balloons" aria-label="Калган шарлар"></div>
      <div class="clue">
        <div class="em" id="clueEmoji"></div>
        <div class="tr" id="clueTr"></div>
      </div>
      <div class="slots" id="slots" aria-live="polite"></div>
      <div class="kb" id="kb"></div>
    </div>
    <div class="center" style="margin-top:14px">
      <div class="chips" id="catChips" style="justify-content:center"></div>
    </div>
  </main>

  <div class="modal hidden" id="endModal">
    <div class="panel">
      <div class="bigEmoji" id="endEmoji"></div>
      <h2 class="gH" id="endTitle"></h2>
      <p style="font-size:1.8rem;font-weight:900;letter-spacing:.1em;margin:4px 0" id="endWord"></p>
      <p class="muted" id="endTr"></p>
      <button class="btn primary" id="nextBtn" type="button">➡️ Кийинки сөз</button>
    </div>
  </div>

  <script src="../../shared/vocab.js"></script>
  <script src="../../shared/progress.js"></script>
  <script src="../../shared/game-shell.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const V = window.BA_VOCAB, S = window.BAShell, BA = window.BA;
    const LETTERS = 'а б в г д е ё ж з и й к л м н ң о ө п р с т у ү ф х ц ч ш щ ъ ы ь э ю я'.split(' ');
    const KG = new Set(['ң', 'ө', 'ү']);
    const COLORS = ['#f43f5e', '#f59e0b', '#22c55e', '#06b6d4', '#6366f1', '#ec4899'];
    const LIVES = 6;
    let cat = S.recall('bl_cat', 'all');
    const game = { round: 0, score: 0, streak: 0, used: new Set() };
    let st = null;

    S.chipGroup($('catChips'), S.categoryItems(), cat, (v) => { cat = v; S.remember('bl_cat', v); game.used.clear(); next(); });

    function pickWord() {
      // Кеминде 3 тамгалуу сөздөр, ушул сессияда кайталанбайт
      let pool = V.words(cat).filter((w) => w.ky.replace(/[\s-]/g, '').length >= 3 && !game.used.has(w.id));
      if (!pool.length) { game.used.clear(); pool = V.words(cat).filter((w) => w.ky.replace(/[\s-]/g, '').length >= 3); }
      const w = pool[Math.floor(Math.random() * pool.length)];
      game.used.add(w.id);
      return w;
    }

    function next() {
      $('endModal').classList.add('hidden');
      const w = pickWord();
      st = { w, letters: [...w.ky], guessed: new Set(), lives: LIVES, over: false };
      game.round++;
      $('clueEmoji').textContent = w.emoji;
      $('clueTr').textContent = `🇷🇺 ${w.ru} · 🇬🇧 ${w.en}`;
      $('balloons').innerHTML = Array.from({ length: LIVES }, (_, i) => `<div class="bl" style="--c:${COLORS[i]}"></div>`).join('');
      const kb = $('kb'); kb.innerHTML = '';
      LETTERS.forEach((l) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'key' + (KG.has(l) ? ' kg' : ''); b.textContent = l; b.dataset.l = l;
        b.addEventListener('click', () => guess(l));
        kb.appendChild(b);
      });
      renderSlots();
      hud();
    }

    function renderSlots(reveal) {
      $('slots').innerHTML = st.letters.map((ch) => {
        if (ch === ' ' || ch === '-') return `<div class="slot space">${ch === '-' ? '-' : ''}</div>`;
        const known = st.guessed.has(ch);
        if (known) return `<div class="slot show">${ch}</div>`;
        return reveal ? `<div class="slot missed">${ch}</div>` : '<div class="slot"></div>';
      }).join('');
    }

    function hud() {
      $('round').textContent = game.round;
      $('score').textContent = game.score;
      $('streak').textContent = game.streak;
    }

    function guess(l) {
      if (!st || st.over || st.guessed.has(l)) return;
      st.guessed.add(l);
      const key = document.querySelector(`.key[data-l="${l}"]`);
      if (st.letters.includes(l)) {
        key.classList.add('ok'); BA.sfx.ok();
        renderSlots();
        const solved = st.letters.every((ch) => ch === ' ' || ch === '-' || st.guessed.has(ch));
        if (solved) finish(true);
      } else {
        key.classList.add('no'); BA.sfx.bad();
        st.lives--;
        const alive = $('balloons').querySelectorAll('.bl:not(.pop)');
        if (alive.length) alive[alive.length - 1].classList.add('pop');
        if (st.lives <= 0) finish(false);
      }
      key.disabled = true;
    }

    function finish(won) {
      st.over = true;
      BA.markWord(st.w.id, won);
      if (won) {
        const pts = 10 + st.lives * 5;
        game.score += pts; game.streak++;
        BA.addXP('balloons', Math.round(pts / 2));
        BA.saveBest('balloons', game.score);
        BA.sfx.win();
        if (game.streak % 5 === 0) BA.confetti();
      } else {
        game.streak = 0;
        BA.sfx.lose();
        renderSlots(true);
      }
      hud();
      BA.speak(st.w.en, 'en');
      $('endEmoji').textContent = won ? (st.lives === LIVES ? '🌟' : '🎈') : '💥';
      $('endTitle').textContent = won ? (st.lives === LIVES ? 'Мыкты! Бир да ката жок!' : 'Таптың!') : 'Шарлар жарылды...';
      $('endWord').textContent = `${st.w.emoji} ${st.w.ky.toUpperCase()}`;
      $('endTr').textContent = `🇷🇺 ${st.w.ru} · 🇬🇧 ${st.w.en}`;
      setTimeout(() => $('endModal').classList.remove('hidden'), won ? 500 : 900);
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (!$('endModal').classList.contains('hidden')) { if (e.key === 'Enter') next(); return; }
      const k = e.key.toLowerCase();
      if (LETTERS.includes(k)) guess(k);
    });
    $('nextBtn').addEventListener('click', next);
    next();
  })();
  </script>
</body>
</html>

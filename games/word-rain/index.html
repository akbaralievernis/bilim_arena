<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; connect-src 'self' https://udkxmgflbxetfzziftla.supabase.co wss://udkxmgflbxetfzziftla.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Сөз жамгыры — Билим Арена</title>
  <link rel="icon" href="../../assets/brand/favicon-64.png" type="image/png" />
  <link rel="stylesheet" href="../../shared/game.css?v=17" />
  <style>
    .gWrap { max-width: 720px; padding-bottom: 20px; }
    .sky {
      position: relative; height: min(52vh, 440px); border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(224,22,43,.18), rgba(236,72,153,.08) 70%, rgba(34,197,94,.25));
    }
    .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, var(--ok), #16a34a); }
    .drop {
      position: absolute; top: 0; transform: translateX(-50%);
      padding: 10px 16px; border-radius: 16px 16px 16px 4px;
      background: var(--card-strong); border: 2px solid var(--primary);
      font-weight: 900; font-size: clamp(1rem, 3.5vw, 1.35rem); white-space: nowrap; box-shadow: var(--shadow);
    }
    .drop .e { font-size: 1.4em; margin-right: 6px; vertical-align: middle; }
    .drop.hit { border-color: var(--ok); background: var(--ok); color: #fff; transition: transform .3s, opacity .3s; transform: translateX(-50%) scale(1.4); opacity: 0; }
    .drop.miss { border-color: var(--bad); background: var(--bad); color: #fff; }
    .answers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .ans {
      min-height: 60px; padding: 10px; border-radius: 14px; border: 2px solid var(--line);
      background: var(--card-strong); font-weight: 800; font-size: 1.05rem; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    }
    .ans:active { transform: translateY(2px); box-shadow: none; }
    .ans.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .ans.no { background: var(--bad); color: #fff; border-color: var(--bad); }
    .ans kbd { opacity: .5; font-size: .75rem; margin-right: 6px; }
    .lives { letter-spacing: 2px; }
    .pauseCover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2,6,23,.55); font-size: 1.4rem; font-weight: 900; color: #fff; }
  </style>
  <script src="../../shared/lang.js?v=16"></script>
  <script src="./i18n.js?v=15"></script>
  <script src="../../shared/sw-register.js?v=15"></script>
</head>
<body>
  <header class="gTop">
    <a class="iconBtn" href="../../games.html" aria-label="Оюндар"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="title">Сөз жамгыры <small>Сөз жерге түшкөнчө котормосун тап</small></div>
    <button class="iconBtn hidden" id="pauseBtn" type="button" aria-label="Тыным"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
    <button class="iconBtn" id="soundBtn" type="button" aria-label="Үн"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="iconBtn" id="themeBtn" type="button" aria-label="Тема" hidden></button>
  </header>

  <main class="gWrap">
    <section id="setup" class="panel center">
      <div class="bigEmoji" data-icon="rain"></div>
      <h2 class="gH">Сөз жамгыры</h2>
      <p class="muted">Асмандан сөздөр түшөт! Жерге жеткиче туура котормону бас. Ар бир 5 туура жооп — ылдамдык жогорулайт. 3 жан бар.</p>
      <div class="setupGrid">
        <div><div class="fieldLabel">Тил</div><div class="chips" id="pairChips"></div></div>
        <div><div class="fieldLabel">Тема</div><div class="chips" id="catChips"></div></div>
      </div>
      <p class="muted" id="bestLine"></p>
      <button class="btn primary big" id="startBtn" type="button">Баштоо</button>
      <p class="muted" style="font-size:.85rem">Клавиатура: 1, 2, 3, 4 баскычтары</p>
    </section>

    <section id="game" class="hidden">
      <div class="hud">
        <div class="stat"><b id="score">0</b><span>Упай</span></div>
        <div class="stat"><b id="combo">x1</b><span>Комбо</span></div>
        <div class="stat"><b id="level">1</b><span>Деңгээл</span></div>
        <div class="stat"><b class="lives" id="lives"></b><span>Жан</span></div>
      </div>
      <div class="sky" id="sky" translate="no"><div class="ground"></div></div>
      <div class="answers" id="answers" translate="no"></div>
    </section>
  </main>

  <div class="modal hidden" id="endModal">
    <div class="panel">
      <div class="bigEmoji" data-icon="flag"></div>
      <h2 class="gH">Оюн бүттү!</h2>
      <p style="font-size:2rem;font-weight:900;margin:0" id="endScore">0</p>
      <p class="muted" id="endText"></p>
      <div id="mistakes" style="text-align:left;margin:10px 0"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="menuBtn" type="button">Жөндөө</button>
        <button class="btn primary" id="againBtn" type="button">Дагы ойноо</button>
      </div>
    </div>
  </div>

  <script src="../../shared/fresh.js?v=1"></script>
  <script src="../../shared/vocab.js?v=18"></script>
  <script src="../../shared/progress.js?v=15"></script>
  <script src="../../shared/game-shell.js?v=15"></script>
  <script src="./game.js?v=1"></script>
</body>
</html>

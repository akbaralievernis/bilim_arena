<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
    <script src="../../shared/lang.js?v=16"></script>
    <script src="./i18n.js?v=15"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ылдамдык сыноо — Билим Арена</title>
  <link rel="icon" href="../../assets/brand/favicon-64.png" type="image/png" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace; /* Аркадный стиль шрифта */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Легкое затемнение видео для контраста интерфейса */
            filter: brightness(0.6);
            transform: scaleX(-1); /* Зеркально для веб-камеры */
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #00ffcc;
            text-align: center;
            background: rgba(0, 20, 10, 0.8);
            padding: 15px 30px;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 15px #00ffcc;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #ff0055;
            padding: 40px;
            text-align: center;
            color: white;
            border-radius: 20px;
            box-shadow: 0 0 30px #ff0055;
        }

        button {
            background: #ff0055;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 10px;
            font-family: inherit;
            text-transform: uppercase;
            box-shadow: 0 0 15px #ff0055;
            transition: 0.2s;
            pointer-events: auto;
        }

        button:hover {
            background: #ff3377;
            transform: scale(1.05);
        }
    </style>
    
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" integrity="sha384-q1KhAZhJcJXr3zfC3Tz07pBqQSabwFIZhXlmlUAB8s0zk4ETWERkIKGBCFQ5Jc3e" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" integrity="sha384-oHwoZ9HyKv5ark5VOH+XWdbNfmhYtptAOBuV8plz6mAfXvTA6d8fULuYllWouEK2" crossorigin="anonymous"></script>
  <script src="../../shared/camera.js?v=17"></script>
  <script src="../../shared/sw-register.js?v=14"></script>
</head>
<body>
  <a class="ba-back" href="../../games.html" style="position:fixed;top:12px;left:12px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;min-height:44px;border-radius:14px;background:rgba(255,255,255,.94);color:#202B46;font:700 15px/1 'Inter',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 16px rgba(32,43,70,.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Оюндар</span></a>

    <div id="game-container">
        <video id="bg-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-overlay">
            Нейротүйүн жана камера жүктөлүүдө...<br>
            <span style="font-size: 0.8rem; color: #888;">Веб-камерага уруксат бериңиз</span>
        </div>

        <div id="game-over">
            <h1 style="color: #ff0055; margin-top: 0; font-size: 3rem;">ОЮН БҮТТҮ</h1>
            <h2>Сиздин упайыңыз: <span id="final-score">0</span></h2>
            <button data-on="restartGame()">Кайра ойноо</button>
        </div>
    </div>

    <script src="./game.js?v=1"></script>
</body>
</html>

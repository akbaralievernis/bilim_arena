<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — менин прогрессим: деңгээл, XP, статистика, жетишкендиктер жана оюндардын тарыхы." />
  <title>Прогресс — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./core/ui.css?v=13" />
  <link rel="stylesheet" href="./home.css?v=13" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap page profile-page">
    <!-- Кто я и мой уровень -->
    <section class="card profile-card" aria-labelledby="profileName">
      <div class="profile-avatar" id="avatar"></div>
      <div class="profile-main">
        <h1 class="profile-name" id="profileName"></h1>
        <p class="muted profile-level" id="levelLine"></p>
        <div class="xp-line">
          <div class="bar thick" role="progressbar" id="xpBarWrap" aria-valuemin="0" aria-valuemax="100"><i id="xpBar" style="width:0%"></i></div>
          <span class="small muted" id="xpNote"></span>
        </div>
      </div>
      <a class="btn soft profile-edit-link" href="./profile.html" id="settingsLink"></a>
    </section>

    <!-- Совсем новый ученик: одна понятная карточка вместо пустых блоков -->
    <section class="card onboarding hidden" id="emptyProfile" aria-labelledby="emptyTitle">
      <div class="onboarding-art" id="emptyArt" aria-hidden="true"></div>
      <div class="stack" style="gap:10px">
        <h2 id="emptyTitle" data-i18n="profile_empty_title">Сен азырынча оюн ойногон жоксуң.</h2>
        <p class="muted" style="margin:0" data-i18n="profile_empty_text"></p>
        <div><a class="btn primary" href="./games.html" id="firstGameBtn"></a></div>
      </div>
    </section>

    <!-- Статистика: только ненулевые показатели -->
    <section class="hidden" id="statsSection" aria-labelledby="statsTitle">
      <h2 id="statsTitle" class="section-title" data-i18n="profile_stats">Статистика</h2>
      <ul class="stat-grid" id="statGrid"></ul>
    </section>

    <div class="profile-grid">
      <!-- Достижения -->
      <section class="card stack hidden" id="badgeSection" aria-labelledby="badgeTitle">
        <div class="row between">
          <h2 id="badgeTitle" style="margin:0" data-i18n="achievements">Жетишкендиктер</h2>
          <span class="small muted" id="badgeCount"></span>
        </div>
        <div class="badge-grid" id="badgeGrid"></div>
      </section>

      <!-- Последние игры -->
      <section class="card stack hidden" id="historySection" aria-labelledby="historyTitle">
        <h2 id="historyTitle" data-i18n="profile_recent">Оюндардын тарыхы</h2>
        <div id="historyList"></div>
      </section>

      <!-- Карта знаний: только начатые предметы -->
      <section class="card stack hidden" id="mapSection" aria-labelledby="mapTitle">
        <h2 id="mapTitle" data-i18n="knowledge_map">Билим картасы</h2>
        <div id="knowledgeMap" class="stack"></div>
      </section>

      <!-- Что повторить: только если есть ошибки -->
      <section class="card stack hidden" id="reviewSection" aria-labelledby="reviewTitle">
        <h2 id="reviewTitle" data-i18n="results_review">Кайталоо керек</h2>
        <div id="reviewList" class="stack"></div>
      </section>
    </div>
  </main>

  <div id="toasts"></div>
  <script type="module" src="./progress.js?v=13"></script>
</body>
</html>

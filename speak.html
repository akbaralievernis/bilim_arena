<!DOCTYPE html>
<html lang="ky" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Билим Арена — англисче айтылышка машыгуу: сөздү үнүң менен айт, браузер текшерет." />
  <title>Айт! — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./core/ui.css?v=10" />
  <link rel="stylesheet" href="./home.css?v=10" />
</head>

<body>
  <a class="skip-link" href="#main">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap stack" style="padding-top:20px;padding-bottom:40px">

    <!-- Выбор набора и режима -->
    <section class="stack" id="pickScreen">
      <h1 data-i18n="sp_title">Айт! — үн менен машыгуу</h1>
      <p class="muted" data-i18n="sp_intro"></p>
      <div class="card plain small" id="supportNote" role="note"></div>

      <div class="card stack">
        <div class="label" data-i18n="inv_mode">Режим</div>
        <div class="chips" id="modeChips"></div>
        <div class="label" data-i18n="sp_choose_set">Топтомду тандаңыз</div>
        <div class="grid auto" id="setGrid"></div>
      </div>
    </section>

    <!-- Тренировка -->
    <section class="stack hidden" id="playScreen">
      <div class="row between">
        <span class="chip" id="counter"></span>
        <span class="speak-attempts" id="attempts" aria-label=""></span>
      </div>
      <div class="bar"><i id="progressBar" style="width:0%"></i></div>

      <div class="card pad-lg stack speak-card">
        <div class="speak-target" id="target" lang="en"></div>
        <div class="speak-sound muted" id="sound"></div>
        <div class="speak-meaning" id="meaning"></div>
        <div class="speak-tip small hidden" id="tip"></div>

        <div class="speak-actions">
          <button class="btn ghost big" id="listenBtn" type="button" data-i18n="sp_listen">🔊 Угуу</button>
          <button class="btn primary big speak-mic" id="micBtn" type="button" data-i18n="sp_speak_btn">🎤 Айт</button>
        </div>

        <form class="stack hidden" id="typeForm" autocomplete="off">
          <input class="input" id="typeInput" lang="en" autocapitalize="off" spellcheck="false" style="text-align:center;font-size:1.3rem" />
          <button class="btn primary big block" type="submit" data-i18n="sp_check">Текшерүү</button>
        </form>

        <div class="speak-heard small muted" id="heard" aria-live="polite"></div>
        <div class="speak-feedback" id="feedback" role="status" aria-live="polite"></div>

        <div class="row between">
          <button class="btn ghost" id="skipBtn" type="button" data-i18n="sp_skip">Өткөрүү</button>
          <button class="btn primary hidden" id="nextBtn" type="button" data-i18n="next">Андан ары</button>
        </div>
      </div>
    </section>

    <!-- Итог -->
    <section class="card pad-lg stack hidden" id="resultScreen">
      <div class="center stack">
        <div class="entry-icon" id="resultIcon">🎉</div>
        <h1 data-i18n="results_title">Жыйынтык</h1>
      </div>
      <div class="stats" id="resultStats"></div>
      <div>
        <div class="label" data-i18n="sp_practise_more">Дагы машыгуу керек</div>
        <div class="stack" id="practiseList"></div>
      </div>
      <div class="row">
        <button class="btn primary" id="againBtn" type="button" data-i18n="retry">Кайра аракет</button>
        <button class="btn ghost" id="otherBtn" type="button" data-i18n="sp_other_set">Башка топтом</button>
        <a class="btn ghost" href="./progress.html" data-i18n="nav_progress">Прогресс</a>
      </div>
    </section>

  </main>

  <div id="toasts"></div>
  <script type="module" src="./speak.js?v=10"></script>
</body>
</html>

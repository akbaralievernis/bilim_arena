<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — мектеп окуучулары үчүн билим берүүчү оюн платформасы: тил үйрөнүү, логика, командалык жана интерактивдүү оюндар." />
  <title>Билим Арена — ойноп үйрөн</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <meta property="og:title" content="Билим Арена" />
  <meta property="og:description" content="Мектеп окуучулары үчүн билим берүүчү оюн платформасы" />
  <meta property="og:image" content="./assets/suilom.webp" />

  <link rel="stylesheet" href="./core/ui.css?v=14" />
  <link rel="stylesheet" href="./home.css?v=15" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="page home">
    <!-- 1. Приветствие -->
    <section class="hero wrap" aria-labelledby="heroTitle">
      <div class="hero-card">
        <div class="hero-text">
          <p class="hero-kicker" id="heroKicker"></p>
          <h1 id="heroTitle" data-i18n="home_title">Билимиңди оюн менен текшер</h1>
          <p class="hero-sub" data-i18n="home_intro">Ойно, үйрөн жана өз прогрессиңди көр.</p>
          <div class="hero-actions">
            <a class="btn primary big" href="./games.html" id="heroGames"></a>
            <a class="btn big" href="./progress.html" id="heroProgress"></a>
          </div>
        </div>
        <div class="hero-art" id="heroArt" aria-hidden="true"></div>
      </div>
    </section>

    <!-- 2. Поиск игры -->
    <section class="wrap home-search" aria-labelledby="searchTitle">
      <h2 id="searchTitle" class="sr-only" data-i18n="cat_search">Оюн издөө</h2>
      <form class="search-box big-search" id="homeSearch" role="search" action="./games.html">
        <label class="sr-only" for="homeSearchInput" data-i18n="cat_search">Оюн издөө</label>
        <input class="input" id="homeSearchInput" name="q" type="search" autocomplete="off" enterkeyhint="search" />
        <button class="btn primary" type="submit" id="homeSearchBtn"></button>
      </form>
    </section>

    <!-- 3. Категории -->
    <section class="wrap section" aria-labelledby="catTitle">
      <div class="section-head">
        <h2 id="catTitle" data-i18n="home_categories">Оюнду танда</h2>
      </div>
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <!-- 4. Популярные -->
    <section class="wrap section" aria-labelledby="popTitle">
      <div class="section-head">
        <h2 id="popTitle" data-i18n="home_popular">Популярдуу оюндар</h2>
        <a class="section-link" href="./games.html" id="popAll"></a>
      </div>
      <div class="game-grid popular-grid" id="popularGrid"></div>
    </section>

    <!-- 5. Продолжить  ·  6. Прогресс -->
    <section class="wrap section two-col" aria-label="">
      <div class="card continue-card" id="continueCard" aria-labelledby="contTitle"></div>
      <div class="card progress-card" id="progressCard" aria-labelledby="progTitle"></div>
    </section>

    <!-- 7. Учителям -->
    <section class="wrap section" aria-labelledby="raceHomeTitle">
      <div class="teacher-card card">
        <div class="teacher-art" id="raceHomeArt" aria-hidden="true"></div>
        <div class="stack" style="gap:10px">
          <p class="hero-kicker" style="margin:0" data-i18n="race_kicker">Командалык жарыш</p>
          <h2 id="raceHomeTitle">Bilim Arena Race</h2>
          <p class="muted" style="margin:0" data-i18n="race_intro"></p>
          <div><a class="btn primary" href="./race.html" id="raceHomeBtn"></a></div>
        </div>
      </div>
    </section>

    <section class="wrap section" aria-labelledby="teachTitle">
      <div class="teacher-card card">
        <div class="teacher-art" id="teacherArt" aria-hidden="true"></div>
        <div class="stack" style="gap:10px">
          <h2 id="teachTitle" data-i18n="home_teacher_title">Мугалимсизби?</h2>
          <p class="muted" style="margin:0" data-i18n="home_teacher_text">Сабак үчүн оюндарды тандап, окуучулар менен ойно.</p>
          <div><a class="btn primary" href="./teacher.html" id="teacherBtn"></a></div>
        </div>
      </div>
    </section>

    <!-- 8. Подвал -->
    <footer class="wrap footer">
      <div class="footer-row">
        <a class="brand footer-brand" href="./index.html">
          <img class="logo" src="./assets/logo.svg" alt="" width="28" height="28" />
          <span data-i18n="app_name">Билим Арена</span>
        </a>
        <nav class="footer-links" id="footerLinks" aria-label=""></nav>
      </div>
      <p class="muted small" data-i18n="home_footer"></p>
    </footer>
  </main>

  <div id="toasts"></div>
  <script type="module" src="./home.js?v=15"></script>
</body>
</html>

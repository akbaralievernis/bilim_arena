<!DOCTYPE html>
<html lang="ky" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Билим Арена — мектеп үчүн интерактивдүү билим берүү платформасы: сабактар, оюндар, командалык мелдештер жана интерактивдүү доска режими." />
  <title>Билим Арена — Ойлон, Ойно, Жең!</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <meta property="og:title" content="Билим Арена" />
  <meta property="og:description" content="Сабакты интерактивдүү оюнга айландыруучу платформа" />
  <meta property="og:image" content="./assets/suilom.webp" />

  <link rel="stylesheet" href="./core/ui.css?v=3" />
  <link rel="stylesheet" href="./home.css?v=3" />
</head>

<body>
  <a class="skip-link" href="#main">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main">
    <!-- Три входа: ученик с телефона, доска, учитель -->
    <section class="hero wrap">
      <div class="hero-text center">
        <span class="chip on">🇰🇬 100% кыргызча</span>
        <h1 data-i18n="home_hero_title">Сабакты интерактивдүү оюнга айландыр</h1>
        <p class="muted" data-i18n="home_hero_sub"></p>
      </div>

      <div class="grid three entries">
        <a class="entry card" href="./play.html">
          <div class="entry-icon" aria-hidden="true">📱</div>
          <h2 data-i18n="join_title">Оюнга кирүү</h2>
          <p class="muted" data-i18n="home_join_sub"></p>
          <span class="btn primary block" data-i18n="join_button">Кирүү</span>
        </a>

        <a class="entry card" href="./board.html">
          <div class="entry-icon" aria-hidden="true">🖥️</div>
          <h2 data-i18n="board_mode">Доска режими</h2>
          <p class="muted" data-i18n="home_board_sub"></p>
          <span class="btn block" data-i18n="lesson_start">Сабакты баштоо</span>
        </a>

        <a class="entry card" href="./teacher.html">
          <div class="entry-icon" aria-hidden="true">👩‍🏫</div>
          <h2 data-i18n="role_teacher">Мугалим</h2>
          <p class="muted" data-i18n="role_teacher_desc"></p>
          <span class="btn block" data-i18n="nav_dashboard">Панель</span>
        </a>
      </div>
    </section>

    <!-- Прогресс ученика -->
    <section class="wrap" id="progressSection">
      <div class="card stack">
        <div class="row between">
          <div class="row" style="gap:12px">
            <div class="avatar-big" id="avatar" aria-hidden="true">🦊</div>
            <div class="stack" style="gap:2px">
              <b id="profileName">—</b>
              <span class="small muted" id="profileLevel"></span>
            </div>
          </div>
          <a class="btn" href="./progress.html" data-i18n="nav_progress">Прогресс</a>
        </div>
        <div class="bar thick"><i id="xpBar" style="width:0%"></i></div>
        <div class="stats" id="quickStats"></div>
      </div>
    </section>

    <!-- Предметы и темы -->
    <section class="wrap stack" id="subjectsSection">
      <h2 data-i18n="subjects">Предметтер</h2>
      <div class="grid auto" id="subjectGrid"></div>
    </section>

    <!-- Игры платформы -->
    <section class="wrap stack" id="gamesSection">
      <div class="row between">
        <h2 data-i18n="nav_games">Оюндар</h2>
        <div class="chips" id="gameFilters" role="group"></div>
      </div>
      <div class="grid auto" id="gameGrid"></div>
    </section>

    <!-- Для учителя -->
    <section class="wrap stack">
      <h2 data-i18n="home_for_teachers">Мугалимдер үчүн</h2>
      <div class="grid auto" id="teacherTips"></div>
    </section>

    <footer class="wrap footer center">
      <p class="muted small">© 2026 Билим Арена · ОшМУ студенттеринин долбоору</p>
      <p class="muted small" id="footerNote"></p>
    </footer>
  </main>

  <div id="toasts"></div>
  <script type="module" src="./home.js?v=3"></script>
</body>
</html>

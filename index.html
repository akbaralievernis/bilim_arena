<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — мектеп окуучулары үчүн билим берүүчү оюн платформасы: тил үйрөнүү, логика, командалык оюндар жана интерактивдүү доска." />
  <title>Билим Арена — ойноп үйрөн</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <meta property="og:title" content="Билим Арена" />
  <meta property="og:description" content="Мектеп окуучулары үчүн билим берүүчү оюн платформасы" />
  <meta property="og:image" content="./assets/suilom.webp" />

  <link rel="stylesheet" href="./core/ui.css?v=12" />
  <link rel="stylesheet" href="./home.css?v=12" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="page">
    <!-- Приветствие и поиск -->
    <section class="hero wrap" aria-labelledby="heroTitle">
      <div class="hero-card">
        <div class="hero-text">
          <p class="hero-kicker" id="heroKicker"></p>
          <h1 id="heroTitle" data-i18n="home_title">Ойноп үйрөн — сабакта да, үйдө да</h1>
          <p class="hero-sub" data-i18n="home_intro"></p>
          <form class="search-box hero-search" id="heroSearch" role="search" action="./games.html">
            <label class="sr-only" for="heroSearchInput" data-i18n="cat_search">Издөө</label>
            <input class="input" id="heroSearchInput" name="q" type="search" autocomplete="off" />
          </form>
          <div class="hero-actions">
            <a class="btn primary" href="./play.html" id="joinBtn"></a>
            <a class="btn soft" href="./games.html" id="allGamesBtn"></a>
          </div>
        </div>
        <div class="hero-art" id="heroArt" aria-hidden="true"></div>
      </div>
    </section>

    <!-- Категории -->
    <section class="wrap section" aria-labelledby="catTitle">
      <div class="section-head">
        <h2 id="catTitle" data-i18n="home_categories">Оюндардын түрлөрү</h2>
      </div>
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <!-- Популярные -->
    <section class="wrap section" aria-labelledby="popTitle">
      <div class="section-head">
        <h2 id="popTitle" data-i18n="home_popular">Танымал оюндар</h2>
        <a class="section-link" href="./games.html" id="popAll"></a>
      </div>
      <div class="game-grid" id="popularGrid"></div>
    </section>

    <!-- Прогресс и рекомендации -->
    <section class="wrap section two-col">
      <div class="progress-card card" id="progressCard" aria-labelledby="progTitle"></div>
      <div class="stack" style="gap:12px">
        <div class="section-head">
          <h2 id="recTitle" data-i18n="home_recommended">Сага сунушталат</h2>
        </div>
        <div class="rec-list" id="recList"></div>
      </div>
    </section>

    <!-- Учителям -->
    <section class="wrap section" aria-labelledby="teachTitle">
      <div class="teacher-card card">
        <div class="teacher-art" id="teacherArt" aria-hidden="true"></div>
        <div class="stack" style="gap:10px">
          <h2 id="teachTitle" data-i18n="home_teacher_title">Мугалимдер үчүн</h2>
          <p class="muted" style="margin:0" data-i18n="home_teacher_text"></p>
          <ul class="teacher-points" id="teacherPoints"></ul>
          <div class="row" style="gap:10px">
            <a class="btn primary" href="./teacher.html" data-i18n="home_teacher_btn">Мугалимдин панели</a>
            <a class="btn" href="./board.html" data-i18n="home_board_btn">Сабакты доскада баштоо</a>
          </div>
        </div>
      </div>
    </section>

    <footer class="wrap footer">
      <span class="muted small" data-i18n="home_footer"></span>
    </footer>
  </main>

  <div id="toasts"></div>
  <script type="module" src="./home.js?v=12"></script>
</body>
</html>

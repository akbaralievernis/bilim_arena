<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — бардык оюндар: тил үйрөнүү, логика, командалык жана камера менен оюндар. Издөө жана чыпкалар." />
  <title>Оюндар — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./core/ui.css?v=12" />
  <link rel="stylesheet" href="./home.css?v=12" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap page">
    <header class="page-head">
      <h1 id="pageTitle" data-i18n="cat_all_games">Бардык оюндар</h1>
      <p class="muted" id="pageDesc"></p>
    </header>

    <!-- Разделы каталога -->
    <nav class="cat-tabs" id="catTabs"></nav>

    <!-- Поиск, сортировка, фильтры -->
    <div class="toolbar">
      <label class="search-box toolbar-search">
        <span class="sr-only" data-i18n="cat_search">Издөө</span>
        <input class="input" id="searchInput" type="search" autocomplete="off" />
      </label>
      <label class="toolbar-sort">
        <span class="sr-only" data-i18n="cat_sort">Иреттөө</span>
        <select class="input" id="sortSelect"></select>
      </label>
      <button class="btn filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterPanel"></button>
    </div>

    <div class="catalog">
      <aside class="filter-panel card" id="filterPanel">
        <div class="row between filter-head">
          <b data-i18n="cat_filters">Чыпкалар</b>
          <button class="btn ghost small-btn" id="resetBtn" type="button" data-i18n="cat_reset">Тазалоо</button>
        </div>
        <div id="filterGroups" class="stack"></div>
      </aside>

      <section class="catalog-results" aria-labelledby="resultCount">
        <p class="result-count" id="resultCount" role="status" aria-live="polite"></p>
        <div class="game-grid" id="gameGrid"></div>
        <div class="empty-state card hidden" id="emptyState">
          <div class="empty-art" aria-hidden="true"></div>
          <h2 data-i18n="cat_empty_title">Эч нерсе табылган жок</h2>
          <p class="muted" data-i18n="cat_empty_text">Чыпкаларды өзгөртүп же издөөнү тазалап көрүңүз</p>
          <button class="btn primary" id="emptyResetBtn" type="button" data-i18n="cat_reset_all">Бардык чыпкаларды тазалоо</button>
        </div>
      </section>
    </div>
  </main>

  <div id="toasts"></div>
  <script type="module" src="./games.js?v=12"></script>
</body>
</html>

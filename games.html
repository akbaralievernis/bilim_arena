<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />
  <!-- Безопасность: скрипты только с сайта и проверенного CDN, соединения только с базой и сервером знакомства -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://udkxmgflbxetfzziftla.supabase.co wss://udkxmgflbxetfzziftla.supabase.co https://0.peerjs.com wss://0.peerjs.com https://cdn.jsdelivr.net; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — бардык оюндар: тил үйрөнүү, логика, командалык жана камера менен оюндар. Издөө жана чыпкалар." />
  <title>Оюндар — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./core/ui.css?v=14" />
  <link rel="stylesheet" href="./home.css?v=14" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap page catalog-page">
    <header class="page-head">
      <h1 id="pageTitle" data-i18n="cat_all_games">Бардык оюндар</h1>
      <p class="muted" id="pageDesc" data-i18n="cat_all_desc">Өзүңө жаккан оюнду танда.</p>
    </header>

    <!-- Поиск, сортировка, кнопка фильтров -->
    <div class="toolbar">
      <form class="search-box toolbar-search" id="searchForm" role="search">
        <label class="sr-only" for="searchInput" data-i18n="cat_search">Оюн издөө</label>
        <input class="input" id="searchInput" type="search" autocomplete="off" enterkeyhint="search" />
      </form>
      <label class="toolbar-sort">
        <span class="sr-only" data-i18n="cat_sort">Иреттөө</span>
        <select class="input" id="sortSelect"></select>
      </label>
      <button class="btn filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterPanel"></button>
    </div>

    <!-- Разделы каталога -->
    <nav class="cat-tabs" id="catTabs"></nav>

    <div class="catalog">
      <div class="drawer-overlay" id="drawerOverlay" hidden></div>
      <aside class="filter-panel" id="filterPanel" aria-labelledby="filterTitle">
        <div class="filter-head">
          <h2 id="filterTitle" data-i18n="cat_filters">Чыпкалар</h2>
          <button class="btn ghost small-btn" id="resetBtn" type="button" data-i18n="cat_reset">Тазалоо</button>
          <button class="icon-btn drawer-close" id="drawerClose" type="button"></button>
        </div>
        <div id="filterGroups" class="filter-groups"></div>
        <div class="drawer-foot">
          <button class="btn primary block" id="drawerApply" type="button"></button>
        </div>
      </aside>

      <section class="catalog-results" aria-labelledby="resultCount">
        <p class="result-count" id="resultCount" role="status" aria-live="polite"></p>
        <div class="game-grid" id="gameGrid"></div>
        <div class="empty-state card hidden" id="emptyState">
          <div class="empty-art" aria-hidden="true"></div>
          <h2 data-i18n="cat_empty_title">Оюн табылган жок</h2>
          <p class="muted" data-i18n="cat_empty_text">Башка фильтрлерди тандап көр.</p>
          <button class="btn primary" id="emptyResetBtn" type="button" data-i18n="cat_reset_all">Фильтрлерди тазалоо</button>
        </div>
      </section>
    </div>
  </main>

  <div id="toasts"></div>
  <script type="module" src="./games.js?v=15"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />
  <!-- Безопасность: скрипты только с сайта и проверенного CDN, соединения только с базой и сервером знакомства -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://udkxmgflbxetfzziftla.supabase.co wss://udkxmgflbxetfzziftla.supabase.co https://bilimarena-signal.bilimarena-signal.workers.dev wss://bilimarena-signal.bilimarena-signal.workers.dev https://0.peerjs.com wss://0.peerjs.com https://cdn.jsdelivr.net; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — жооп баракчаларын телефондун камерасы менен текшерүү." />
  <title>Сканер — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="./core/ui.css?v=16" />
  <link rel="stylesheet" href="./scan.css?v=1" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap stack" style="padding-top:20px;padding-bottom:40px">
    <div class="row between">
      <h1 data-i18n="omr_title">Баракчаларды сканерлөө</h1>
      <a class="btn ghost" href="./tests.html" data-i18n="tst_title">Менин тесттерим</a>
    </div>
    <p class="muted" data-i18n="omr_intro">Камераны баракчага багыттаңыз: төрт бурчтагы кара белгилер кадрда болсун. Сүрөттөр интернетке жөнөтүлбөйт — баары ушул түзмөктө текшерилет.</p>

    <section class="card stack" id="setup">
      <div class="form-grid">
        <label class="field">
          <span class="label" data-i18n="omr_class">Класс (окуучулардын аты номери боюнча)</span>
          <select class="input" id="classSel"></select>
        </label>
      </div>
      <label class="check"><input type="checkbox" id="isCheck" /> <span data-i18n="tst_is_check">Бул жыйынтык текшерүү</span></label>
      <div class="row" style="gap:8px">
        <button class="btn primary big" id="camBtn" type="button" data-i18n="omr_camera">Камераны ачуу</button>
        <label class="btn soft big" for="fileInput" data-i18n="omr_upload">Сүрөт жүктөө</label>
        <input class="sr-only" id="fileInput" type="file" accept="image/*" multiple />
      </div>
      <p class="small muted" id="camNote" aria-live="polite"></p>
    </section>

    <!-- Камера -->
    <section class="stack hidden" id="camView">
      <div class="scan-view">
        <video id="video" playsinline muted></video>
        <div class="scan-frame" aria-hidden="true"></div>
      </div>
      <p class="center" id="scanStatus" aria-live="polite"></p>
      <button class="btn ghost" id="stopBtn" type="button" data-i18n="omr_stop">Токтотуу</button>
    </section>

    <!-- Результат одного бланка -->
    <section class="card stack hidden" id="resultCard" aria-live="polite">
      <div class="row between">
        <b id="resTitle"></b>
        <b class="scan-score" id="resScore"></b>
      </div>
      <div class="grid two">
        <canvas id="resCanvas" class="scan-canvas"></canvas>
        <div class="stack">
          <div class="form-grid">
            <label class="field">
              <span class="label" data-i18n="omr_number">Номер</span>
              <input class="input" id="resNumber" type="number" min="1" max="99" />
            </label>
            <label class="field">
              <span class="label" data-i18n="tst_student_name">Окуучунун аты</span>
              <input class="input" id="resName" maxlength="40" />
            </label>
          </div>
          <p class="small" id="resWarn" style="color:var(--warn-ink)"></p>
          <div class="stack" id="resIssues"></div>
          <div class="row" style="gap:8px">
            <button class="btn primary big" id="acceptBtn" type="button" data-i18n="omr_accept">Туура — сактоо</button>
            <button class="btn ghost" id="skipBtn" type="button" data-i18n="omr_skip">Өткөрүп жиберүү</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Проверенные бланки -->
    <section class="card stack" id="sessionCard">
      <div class="row between">
        <b data-i18n="omr_checked">Текшерилген баракчалар</b>
        <span class="small muted" id="sessionCount"></span>
      </div>
      <div class="stack" id="sessionList"></div>
      <p class="small muted" id="fileErrors"></p>
      <div><button class="btn primary" id="finishBtn" type="button" disabled data-i18n="omr_finish">Отчетко сактоо</button></div>
    </section>
  </main>

  <div id="toasts"></div>
  <script type="module" src="./scan.js?v=2"></script>
</body>
</html>

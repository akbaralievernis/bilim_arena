<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />
  <!-- Безопасность: скрипты только с сайта и проверенного CDN, соединения только с базой и сервером знакомства -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://udkxmgflbxetfzziftla.supabase.co wss://udkxmgflbxetfzziftla.supabase.co https://0.peerjs.com wss://0.peerjs.com https://cdn.jsdelivr.net; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — үй тапшырмалар: мугалим берген тапшырмаларды аткарып, каталарыңызды талдаңыз." />
  <title>Үй тапшырмалар — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="./core/ui.css?v=14" />
  <link rel="stylesheet" href="./home.css?v=14" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap stack" style="padding-top:20px;padding-bottom:40px">

    <!-- Список заданий -->
    <section class="stack" id="listScreen">
      <div class="row between">
        <h1 data-i18n="hw_title">Үй тапшырмалар</h1>
        <span class="chip" id="countChip"></span>
      </div>
      <div class="grid auto" id="taskList"></div>
    </section>

    <!-- Перед началом: цель, правила, срок -->
    <section class="card pad-lg stack hidden" id="introScreen">
      <div class="center stack">
        <div class="entry-icon" id="introIcon" aria-hidden="true"></div>
        <h1 id="introTitle"></h1>
        <p class="muted" id="introMeta"></p>
      </div>
      <div class="hw-meta" id="introDetails"></div>
      <div class="card plain">
        <div class="label" data-i18n="game_how">Кантип ойнойт</div>
        <p id="introHow"></p>
      </div>
      <button class="btn primary big block" id="startBtn" type="button" data-i18n="hw_start">Баштоо</button>
      <button class="btn ghost block" id="backBtn" type="button" data-i18n="back">Артка</button>
    </section>

    <!-- Выполнение -->
    <section class="stack hidden" id="playScreen">
      <div class="row between">
        <span class="chip" id="counter"></span>
        <span class="timer" id="timer">0</span>
      </div>
      <div class="bar"><i id="progressBar" style="width:0%"></i></div>
      <div class="card pad-lg stack">
        <div class="question-prompt" id="prompt"></div>
        <div id="answerArea"></div>
        <div class="explain hidden" id="explain"></div>
      </div>
    </section>

    <!-- Результат -->
    <section class="card pad-lg hidden result-screen" id="resultScreen" aria-live="polite"></section>

  </main>

  <div id="toasts"></div>
  <script type="module" src="./tasks.js?v=14"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ky" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Билим Арена — суроолор китепканасы жана конструктору: суроо түзүү, өзгөртүү, тапшырма чыгаруу." />
  <title>Менин суроолорум — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./core/ui.css?v=11" />
  <link rel="stylesheet" href="./home.css?v=11" />
</head>

<body>
  <a class="skip-link" href="#main">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap stack" style="padding-top:20px;padding-bottom:40px">

    <!-- Библиотека -->
    <section class="stack" id="listScreen">
      <div class="row between">
        <h1 data-i18n="qb_title">Менин суроолорум</h1>
        <div class="row" style="gap:8px">
          <a class="btn ghost" href="./homework.html" data-i18n="hw_title">Үй тапшырмалар</a>
          <button class="btn primary" id="createBtn" type="button">➕ <span data-i18n="qb_create">Суроо түзүү</span></button>
        </div>
      </div>

      <!-- Фильтры -->
      <div class="card stack">
        <div class="form-grid">
          <label class="field">
            <span class="label" data-i18n="lesson_subject">Предмет</span>
            <select class="input" id="filterSubject"></select>
          </label>
          <label class="field">
            <span class="label" data-i18n="lesson_grade">Класс</span>
            <select class="input" id="filterGrade"></select>
          </label>
          <label class="field">
            <span class="label" data-i18n="lesson_topic">Тема</span>
            <select class="input" id="filterTopic"></select>
          </label>
          <label class="field">
            <span class="label" data-i18n="hw_skill">Көндүм</span>
            <select class="input" id="filterSkill"></select>
          </label>
          <label class="field">
            <span class="label" data-i18n="hw_difficulty">Татаалдыгы</span>
            <select class="input" id="filterDifficulty"></select>
          </label>
          <label class="field">
            <span class="label" data-i18n="qb_type">Тапшырманын түрү</span>
            <select class="input" id="filterType"></select>
          </label>
          <label class="field">
            <span class="label" data-i18n="qb_search">Издөө</span>
            <input class="input" id="filterSearch" type="search" />
          </label>
        </div>
      </div>

      <div class="row between">
        <span class="small muted" id="countLabel"></span>
        <div class="row" style="gap:8px">
          <button class="btn ghost" id="selectAllBtn" type="button" data-i18n="select_all">Баарын тандоо</button>
          <button class="btn ghost" id="clearSelBtn" type="button" data-i18n="clear_sel">Тазалоо</button>
          <button class="btn primary" id="makeAssignmentBtn" type="button" disabled>
            📝 <span data-i18n="qb_make_assignment">Тандалгандан тапшырма түзүү</span>
          </button>
        </div>
      </div>

      <div class="stack" id="questionList"></div>
    </section>

    <!-- Конструктор вопроса -->
    <section class="card pad-lg stack hidden" id="formScreen">
      <h1 id="formTitle" data-i18n="qb_create">Суроо түзүү</h1>

      <div class="form-grid">
        <label class="field">
          <span class="label" data-i18n="lesson_subject">Предмет</span>
          <select class="input" id="fSubject"></select>
        </label>
        <label class="field">
          <span class="label" data-i18n="lesson_grade">Класс</span>
          <select class="input" id="fGrade"></select>
        </label>
        <label class="field">
          <span class="label" data-i18n="hw_section">Бөлүм</span>
          <input class="input" id="fSection" readonly />
        </label>
        <label class="field">
          <span class="label" data-i18n="lesson_topic">Тема</span>
          <select class="input" id="fTopic"></select>
        </label>
        <label class="field">
          <span class="label" data-i18n="hw_skill">Көндүм</span>
          <select class="input" id="fSkill"></select>
        </label>
        <label class="field">
          <span class="label" data-i18n="hw_difficulty">Татаалдыгы</span>
          <select class="input" id="fDifficulty"></select>
        </label>
        <label class="field">
          <span class="label" data-i18n="hw_xp">XP</span>
          <input class="input" id="fXP" type="number" min="5" max="100" step="5" value="10" />
        </label>
        <label class="field">
          <span class="label" data-i18n="qb_type">Тапшырманын түрү</span>
          <select class="input" id="fType"></select>
        </label>
      </div>

      <label class="field">
        <span class="label" data-i18n="qb_question">Суроонун тексти</span>
        <textarea class="input" id="fQuestion" rows="2"></textarea>
      </label>

      <!-- Поля ответа зависят от типа задания -->
      <div class="card plain stack" id="answerFields"></div>

      <label class="field">
        <span class="label" data-i18n="qb_explanation">Түшүндүрмө</span>
        <textarea class="input" id="fExplanation" rows="2"></textarea>
      </label>

      <div class="row">
        <button class="btn primary big" id="saveBtn" type="button" data-i18n="save">Сактоо</button>
        <button class="btn ghost" id="cancelBtn" type="button" data-i18n="cancel">Жокко чыгаруу</button>
      </div>
    </section>

  </main>

  <div id="toasts"></div>
  <script type="module" src="./questions.js?v=11"></script>
</body>
</html>

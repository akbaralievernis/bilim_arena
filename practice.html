<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>
  <meta charset="utf-8" />

  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <meta name="description" content="Билим Арена — өз алдынча машыгуу: теманы тандап, суроолорго жооп бериңиз." />
  <title>Машыгуу — Билим Арена</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="./core/ui.css?v=14" />
  <link rel="stylesheet" href="./home.css?v=14" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Мазмунга өтүү</a>
  <div id="header"></div>

  <main id="main" class="wrap stack" style="padding-top:20px;padding-bottom:40px">

    <!-- Выбор темы -->
    <section class="stack" id="pickScreen">
      <h1 data-i18n="nav_practice">Машыгуу</h1>
      <div class="card stack">
        <div class="label" data-i18n="lesson_subject">Предмет</div>
        <div class="chips" id="subjectChips"></div>
        <div class="label" data-i18n="topic_choose">Теманы тандаңыз</div>
        <div class="grid auto" id="topicGrid"></div>
      </div>
    </section>

    <!-- Экран «перед игрой»: цель, правила, время -->
    <section class="card pad-lg stack hidden" id="introScreen">
      <div class="center stack">
        <div class="entry-icon" id="introIcon" aria-hidden="true"></div>
        <h1 id="introTitle"></h1>
        <p class="muted" id="introSubject"></p>
      </div>
      <div class="grid two">
        <div class="card plain">
          <div class="label" data-i18n="game_goal">Максат</div>
          <p id="introGoal"></p>
        </div>
        <div class="card plain">
          <div class="label" data-i18n="game_how">Кантип ойнойт</div>
          <p id="introHow"></p>
        </div>
      </div>
      <div class="stats" id="introStats"></div>
      <button class="btn primary big block" id="startBtn" type="button" data-i18n="game_start">Оюнду баштоо</button>
      <button class="btn ghost block" id="backBtn" type="button" data-i18n="back">Артка</button>
    </section>

    <!-- Игра -->
    <section class="stack hidden" id="playScreen">
      <div class="row between">
        <span class="chip" id="counter"></span>
        <span class="timer" id="timer">0</span>
      </div>
      <div class="bar"><i id="progressBar" style="width:0%"></i></div>
      <div class="card pad-lg stack">
        <div class="question-prompt" id="prompt"></div>
        <div class="options" id="options"></div>
        <div id="inputWrap" class="hidden">
          <input class="input" id="answerInput" style="text-align:center;font-size:1.3rem" />
          <button class="btn primary big block" id="sendBtn" type="button" style="margin-top:10px" data-i18n="send_answer">Жооп берүү</button>
        </div>
        <div class="explain hidden" id="explain"></div>
      </div>
    </section>

    <!-- Результат -->
    <section class="card pad-lg hidden result-screen" id="resultScreen" aria-live="polite"></section>

  </main>

  <div id="toasts"></div>
  <script type="module" src="./practice.js?v=14"></script>
</body>
</html>

    <style>
        /* Вместо Tailwind CDN: только классы, которые есть на странице */
        *, *::before, *::after { box-sizing: border-box; }
        .flex { display: flex; } .flex-col { flex-direction: column; } .items-center { align-items: center; }
        .gap-2 { gap: .5rem; } .gap-4 { gap: 1rem; } .inline-block { display: inline-block; } .w-max { width: max-content; }
        .w-12 { width: 3rem; } .h-12 { height: 3rem; } .mt-2 { margin-top: .5rem; } .mt-4 { margin-top: 1rem; }
        .px-3 { padding-left: .75rem; padding-right: .75rem; } .py-1 { padding-top: .25rem; padding-bottom: .25rem; }
        .text-xs { font-size: .75rem; line-height: 1rem; } .text-xl { font-size: 1.25rem; line-height: 1.75rem; } .text-5xl { font-size: 3rem; line-height: 1; }
        .font-bold { font-weight: 700; } .font-black { font-weight: 900; } .uppercase { text-transform: uppercase; }
        .tracking-tighter { letter-spacing: -.05em; } .tracking-widest { letter-spacing: .1em; }
        .text-green-400 { color: #4ade80; } .text-green-500 { color: #22c55e; } .text-cyan-400 { color: #22d3ee; }
        .border { border-width: 1px; border-style: solid; } .border-4 { border-width: 4px; border-style: solid; }
        .border-gray-700 { border-color: #374151; } .border-cyan-400 { border-color: #22d3ee; } .border-red-500 { border-color: #ef4444; }
        .border-t-transparent { border-top-color: transparent; }
        .rounded { border-radius: .25rem; } .rounded-full { border-radius: 9999px; }
        .scale-110 { transform: scale(1.1); }
        .animate-spin { animation: tw-spin 1s linear infinite; } @keyframes tw-spin { to { transform: rotate(360deg); } }

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #video-container { 
            position: absolute; 
            inset: 0; 
            z-index: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #video-element { 
            min-width: 100%; 
            min-height: 100%; 
            width: auto; 
            height: auto; 
            object-fit: cover;
            transform: scaleX(-1);
        }
        canvas#output-canvas { 
            position: absolute; 
            inset: 0; 
            z-index: 5; 
            pointer-events: none;
            width: 100% !important;
            height: 100% !important;
        }
        #three-container { position: absolute; inset: 0; z-index: 10; }
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
        .progress-ring { position: absolute; width: 80px; height: 80px; transform: translate(-50%, -50%); display: none; }
        .progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
        .ring-bg { stroke: rgba(255, 255, 255, 0.2); }
        .ring-bar { stroke: #00f2ff; stroke-dasharray: 226; stroke-dashoffset: 226; transition: stroke-dashoffset 0.1s linear; }
        .delete-mode .ring-bar { stroke: #ff0000; }
        .move-mode .ring-bar { stroke: #ffd700; }
        #loading-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #00f2ff; }
    </style>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
    <script src="../shared/lang.js?v=16"></script>
    <script src="./neon-draw.i18n.js?v=15"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неон сүрөт — Билим Арена</title>
  <link rel="icon" href="../assets/brand/favicon-64.png" type="image/png" />
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" integrity="sha384-oHwoZ9HyKv5ark5VOH+XWdbNfmhYtptAOBuV8plz6mAfXvTA6d8fULuYllWouEK2" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" integrity="sha384-q1KhAZhJcJXr3zfC3Tz07pBqQSabwFIZhXlmlUAB8s0zk4ETWERkIKGBCFQ5Jc3e" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" integrity="sha384-W/7NVG2tfN12ld8faSFVOZ/W4UHFHze98GqEUPTl8EjY9QDwCKQIzoCHp8/IlIIr" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #ff00ea;
            --neon-yellow: #ffea00;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-white: #ffffff;
            --dark-bg: #050505;
            --panel-bg: rgba(0, 242, 255, 0.08);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace;
            color: var(--neon-blue);
        }

        #input_video { display: none; }

        #output_canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            transform: scaleX(-1);
            will-change: transform;
        }

        .ui-overlay {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .status-panel {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .mode-indicator {
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 8px;
            display: block;
            text-shadow: 0 0 8px var(--neon-blue);
        }

        /* Кнопки навигации */
        .nav-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .planet-btn, .kainat-btn {
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 25px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 160px;
        }

        /* Планета */
        .planet-btn {
            border: 2px solid var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.3);
        }

        .planet-btn:hover {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 30px var(--neon-purple);
            transform: translateY(-2px);
        }

        /* Космос */
        .kainat-btn {
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }

        .kainat-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 30px var(--neon-green);
            transform: translateY(-2px);
        }

        /* Палитра цветов */
        .color-palette {
            position: absolute;
            left: 20px;
            top: 150px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
        }

        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.2);
        }

        .color-btn.active {
            border-color: white;
            box-shadow: 0 0 15px currentColor;
        }

        .clear-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(255, 49, 49, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 12px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 49, 49, 0.2);
            pointer-events: auto;
        }

        .clear-btn:hover {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-red);
        }

        .instructions {
            position: absolute;
            bottom: 20px; right: 20px;
            font-size: 0.85rem;
            text-align: right;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-right: 4px solid var(--neon-blue);
            z-index: 10;
            line-height: 1.6;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .loader {
            border: 3px solid #111;
            border-top: 3px solid var(--neon-blue);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  <script src="../shared/camera.js?v=17"></script>
  <script src="../shared/sw-register.js?v=14"></script>
</head>
<body>
  <a class="ba-back" href="../games.html" style="position:fixed;top:12px;left:12px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;min-height:44px;border-radius:14px;background:rgba(255,255,255,.94);color:#202B46;font:700 15px/1 'Inter',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 16px rgba(32,43,70,.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Оюндар</span></a>

    <div id="loading-screen">
        <div class="loader"></div>
        <p style="margin-top: 20px; letter-spacing: 3px;">ЖҮКТӨЛҮҮДӨ...</p>
    </div>


    <!-- Выбор цвета -->
    <div class="color-palette">
        <div class="color-btn active" data-on="changeColor('#ff3131', this)" style="background: var(--neon-red); color: var(--neon-red);"></div>
        <div class="color-btn" data-on="changeColor('#00f2ff', this)" style="background: var(--neon-blue); color: var(--neon-blue);"></div>
        <div class="color-btn" data-on="changeColor('#ffffff', this)" style="background: var(--neon-white); color: var(--neon-white);"></div>
        <div class="color-btn" data-on="changeColor('#39ff14', this)" style="background: var(--neon-green); color: var(--neon-green);"></div>
    </div>

    <button class="clear-btn" data-on="clearCanvas()">ТАЗАЛОО</button>

    <div class="ui-overlay">
        <div class="status-panel">
            <div style="font-size: 0.7rem; opacity: 0.7;">ТУТУМ: ОПТИМИЗАЦИЯЛАНДЫ</div>
            <div class="mode-indicator" id="current-mode">БАЙКОО</div>
        </div>
    </div>

    <div class="instructions">
        <div>Кантип кармайт:</div>
        <div>1. Сызыкка жакындаңыз</div>
        <div>2. Баш бармак менен сөөмөйдү бириктириңиз (чымчуу)</div>
        <div style="color:var(--neon-green)">3. Сызыкты кармап, жылдырыңыз</div>
    </div>

    <video id="input_video"></video>
    <canvas id="output_canvas"></canvas>

    <script src="./neon-draw.js?v=1"></script>
</body>
</html>

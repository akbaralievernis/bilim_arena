    <style>
        /* Вместо Tailwind CDN: только классы, которые есть на странице */
        *, *::before, *::after { box-sizing: border-box; }
        .flex { display: flex; } .flex-col { flex-direction: column; } .items-center { align-items: center; }
        .gap-2 { gap: .5rem; } .gap-4 { gap: 1rem; } .inline-block { display: inline-block; } .w-max { width: max-content; }
        .w-12 { width: 3rem; } .h-12 { height: 3rem; } .mt-2 { margin-top: .5rem; } .mt-4 { margin-top: 1rem; }
        .px-3 { padding-left: .75rem; padding-right: .75rem; } .py-1 { padding-top: .25rem; padding-bottom: .25rem; }
        .text-xs { font-size: .75rem; line-height: 1rem; } .text-xl { font-size: 1.25rem; line-height: 1.75rem; } .text-5xl { font-size: 3rem; line-height: 1; }
        .font-bold { font-weight: 700; } .font-black { font-weight: 900; } .uppercase { text-transform: uppercase; }
        .tracking-tighter { letter-spacing: -.05em; } .tracking-widest { letter-spacing: .1em; }
        .text-green-400 { color: #4ade80; } .text-green-500 { color: #22c55e; } .text-cyan-400 { color: #22d3ee; }
        .border { border-width: 1px; border-style: solid; } .border-4 { border-width: 4px; border-style: solid; }
        .border-gray-700 { border-color: #374151; } .border-cyan-400 { border-color: #22d3ee; } .border-red-500 { border-color: #ef4444; }
        .border-t-transparent { border-top-color: transparent; }
        .rounded { border-radius: .25rem; } .rounded-full { border-radius: 9999px; }
        .scale-110 { transform: scale(1.1); }
        .animate-spin { animation: tw-spin 1s linear infinite; } @keyframes tw-spin { to { transform: rotate(360deg); } }

        body { margin: 0; overflow: hidden; background: #000000; color: white; font-family: 'Segoe UI', sans-serif; }
        #video-container { position: relative; width: 100vw; height: 100vh; background: #000000; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; transform: scaleX(-1); }
        video { position: absolute; width: 1px; height: 1px; opacity: 0; }
        #ui { position: absolute; top: 30px; left: 30px; z-index: 20; pointer-events: none; }
        .crosshair { 
            position: absolute; 
            width: 80px; 
            height: 80px; 
            border: 2px solid #22c55e; 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
            z-index: 30; 
            transition: border-color 0.1s, transform 0.1s;
        }
        .crosshair.firing {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.3);
            transform: translate(-50%, -80%) scale(1.3);
        }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: currentColor; }
        .crosshair::before { width: 100%; height: 1px; top: 50%; left: 0; }
        .crosshair::after { width: 1px; height: 100%; left: 50%; top: 0; }
        .center-dot { position: absolute; width: 6px; height: 6px; background: #22c55e; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        .speed-badge {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: monospace;
            transition: all 0.2s;
        }
        .score-penalty { color: #ef4444; animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            50% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
    </style>
